name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi httpx pyyaml

      - name: Byte-compile all backend sources
        run: python -m compileall -q __init__.py git_review dashboard/plugin_api.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  desktop-js:
    name: Desktop plugin.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check desktop/plugin.js

      - name: Desktop VM smoke harness
        run: node tests/desktop_plugin_smoke.mjs desktop/plugin.js

      - name: Pane render tests (real React, stubbed SDK)
        run: |
          npm ci || npm install --no-audit --no-fund
          node --test tests/pane.test.mjs

      - name: Node unit tests
        run: node --test tests/diff.test.mjs

      - name: Import allowlist (loader contract)
        run: node tests/import_allowlist.mjs desktop/plugin.js

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

      - name: No machine-specific paths
        run: |
          # Publication rule: the plugin is setup-agnostic. Only generic machine
          # paths are checked here; a maintainer-specific name denylist must never
          # be committed (keep it in a gitignored local script).
          # ci.yml itself contains this pattern, so it is excluded from the scan.
          if grep -RniE '/Users/|C:\\Users|\.cursor' --include='*.py' --include='*.js' --include='*.mjs' --include='*.yaml' --include='*.yml' --include='*.md' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=ci.yml; then
            echo "::error::Machine-specific identifiers found"; exit 1
          fi

      - name: Package builds clean
        run: |
          python scripts/package.py
          python - <<'PY'
          import glob, zipfile
          (archive,) = glob.glob("dist/git-review-*.zip")
          z = zipfile.ZipFile(archive)
          bad = [n for n in z.namelist() if "__pycache__" in n or n.endswith(".pyc")]
          assert not bad, bad
          print("package OK:", len(z.namelist()), "files")
          PY
