name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests before packaging
        run: |
          python -m pip install fastapi httpx pyyaml
          python -m unittest discover -s tests -q

      - name: Desktop plugin syntax check
        run: node --check desktop/plugin.js

      - name: Build package
        run: python scripts/package.py

      - name: Create GitHub release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/git-review-*.zip \
            --title "git-review $TAG" \
            --generate-notes
