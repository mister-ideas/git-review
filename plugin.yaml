name: git-review
version: 0.1.27
description: Read-only Git review pane for focused repositories and configured worktree roots.
author: mister-ideas
license: MIT
manifest_version: 1
requires_hermes: ">=0.21.6"
kind: standalone
provides_tools:
  - git_review_select
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  repos:
    type: string
    default: ""
    description: Newline-separated absolute repository paths to offer.
  roots:
    type: string
    default: ""
    description: Newline-separated absolute directories to scan for worktrees (bounded two levels, at most 256 directories).
  read_only:
    type: boolean
    default: false
    description: Hide stage, discard, commit, push and PR actions and refuse them in the backend.
  run_repo_programs:
    type: boolean
    default: false
    description: Let writes run programs a repository's own config names (hooks, filter drivers, signing and SSH commands). Off by default; with it off, hooks are skipped and such writes are refused.
